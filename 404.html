<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ページが見つかりません ｜ 短い休日</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%277%27%20fill%3D%27%2314181A%27%2F%3E%3Ctext%20x%3D%2716%27%20y%3D%2724%27%20font-size%3D%2721%27%20text-anchor%3D%27middle%27%20fill%3D%27%23F0F1F1%27%20font-family%3D%27serif%27%3E%E4%BC%91%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
:root{
  --paper:#F0F1F1; --surface:#FAFAF9; --surface-2:#E6E8E7;
  --ink:#14181A; --body-ink:#21272A; --muted:#5B646B; --faint:#8A9299; --rule:#D0D4D3;
  --hi:#8A6233; --hi-soft:#8a62331a; --hi-line:#8a623359;
  --yo:#3B5674; --yo-soft:#3b56741a; --yo-line:#3b567459;
  --shadow:0 1px 2px #14181a0d,0 8px 24px #14181a0a;
  --mincho:"Hiragino Mincho ProN","HiraMinProN-W3","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP","Source Han Serif","IPAexMincho","TakaoExMincho","MS PMincho",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP","Noto Sans CJK JP","IPAexGothic",system-ui,-apple-system,"Segoe UI","Meiryo",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121517; --surface:#191D20; --surface-2:#212629;
    --ink:#E6E9E8; --body-ink:#D6DBD9; --muted:#99A2A8; --faint:#6C747A; --rule:#2D3336;
    --hi:#D3AC79; --hi-soft:#d3ac791f; --hi-line:#d3ac7966;
    --yo:#90B2D0; --yo-soft:#90b2d01f; --yo-line:#90b2d066;
    --shadow:0 1px 2px #0006,0 8px 24px #0004;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121517; --surface:#191D20; --surface-2:#212629;
  --ink:#E6E9E8; --body-ink:#D6DBD9; --muted:#99A2A8; --faint:#6C747A; --rule:#2D3336;
  --hi:#D3AC79; --hi-soft:#d3ac791f; --hi-line:#d3ac7966;
  --yo:#90B2D0; --yo-soft:#90b2d01f; --yo-line:#90b2d066;
  --shadow:0 1px 2px #0006,0 8px 24px #0004;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);
 display:grid;place-items:center;text-align:center;padding:24px;line-height:1.9}
.b{display:flex;flex-direction:column;gap:20px;align-items:center;max-width:34em}
.n{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--faint)}
h1{margin:0;font-family:var(--mincho);font-weight:600;font-size:clamp(22px,5vw,30px);letter-spacing:.1em}
p{margin:0;color:var(--muted);font-size:14px}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:2px;font-family:var(--mincho)}
a:hover{border-color:var(--ink)}
</style>
</head>
<body>
<div class="b">
  <p class="n">404</p>
  <h1>そのページは、覚えていません</h1>
  <p>お探しのページは、木曜の夜にどこかへ行ってしまったようです。</p>
  <p><a href="./">短い休日をはじめから読む</a></p>
</div>
</body>
</html>
